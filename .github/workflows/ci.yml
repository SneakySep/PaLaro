name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: palaro
          POSTGRES_PASSWORD: palaro_dev
          POSTGRES_DB: palaro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        # Install from the lock file so CI matches the versions that were
        # actually tested. requirements.txt is loose on purpose (it is the
        # human-edited input); the lock is the reproducible output.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://palaro:palaro_dev@localhost:5432/palaro
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # next-env.d.ts and .next/types are generated and gitignored, so a fresh
      # checkout has no route types yet. Generate them before tsc runs.
      - name: Generate Next.js types
        working-directory: frontend
        run: npx next typegen

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
