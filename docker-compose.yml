services:
  db:
    image: postgres:16-alpine
    container_name: palaro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-palaro_dev}
      POSTGRES_DB: ${POSTGRES_DB:-palaro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palaro} -d ${POSTGRES_DB:-palaro}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
